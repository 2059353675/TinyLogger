name: CMake Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    timeout-minutes: 20
    strategy:
      max-parallel: 3
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ---- Debug ----
      - name: Configure CMake (Debug)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DTINYLOGGER_BUILD_TESTS=ON

      - name: Build (Debug)
        run: cmake --build build --config Debug

      - name: Run Tests (Debug)
        run: ctest --test-dir build --output-on-failure

      # ---- Clean ----
      - name: Clean artifacts
        shell: bash
        run: |
          cmake --build build --target clean 2>/dev/null || true
          rm -rf outputs

      # ---- Release ----
      - name: Configure CMake (Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DTINYLOGGER_BUILD_TESTS=ON

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Run Tests (Release)
        run: ctest --test-dir build --output-on-failure
